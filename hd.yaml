# hd: the four facts the harness cannot derive. Everything else is derived: clones live under work/ and are made by
# the harness; a track's base is its repo's default branch; a change's dev ref is <track>/<slug> (fork: dev/<slug>).
repos: {client: AlexPerrin/osrs-plugins-reverse, fork: AlexPerrin/OpenRune-Server, upstream: OpenRune/OpenRune-Server, harness: AlexPerrin/osrs-harness}
work: ~/src/work          # v8's clones (work/repos/<name>), the per-change clones and build copies, the cache store
agents: 3                 # runs alive at once
context_limit: 150000     # tokens; past it the hook tells a run to hand off
pins: []                  # fork branches every integration tree carries besides the changes: the user's list, not v7's
