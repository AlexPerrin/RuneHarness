# hd: the facts the harness cannot derive. A repo's path is relative to this file; base is the full ref a candidate
# starts from and (for the tracks without an upstream) the branch a ship fast-forwards; prefix names dev branches; remote is where
# dev refs are pushed (in the product clones `origin` is upstream and `fork` the fork); none: the dev ref stays local. Scripts, rules and skills live in this repo (tracks/<repo>/, .claude/skills/);
# the product repos hold product code only. Per-change clones and build copies are worktrees under <repo>/.worktrees/.
repos:
  client:    {name: AlexPerrin/osrs-plugins-reverse,   path: ~/osrs-plugins-reverse,        base: refs/remotes/origin/main,   prefix: client, remote: origin}
  fork:      {name: AlexPerrin/OpenRune-Server,         path: ~/src/OpenRune-Server,         base: refs/remotes/origin/main,   upstream: OpenRune/OpenRune-Server,         remote: fork,
              pins: [local/quest-test-fixture, local/android, {local/local-auth: server-token-auth}, local/test-commands, local/world-settings, local/skip-cs2-packs, local/op-overrides, local/spotless-241]}   # fork branches every staging tree carries besides the changes, in merge order: the user's list; {pin: slug} leaves staging as that change's head merges
  central:   {name: AlexPerrin/OpenRune-Central-Server, path: ~/src/OpenRune-Central-Server, base: refs/remotes/origin/main,   upstream: OpenRune/OpenRune-Central-Server, remote: fork}
  filestore: {name: AlexPerrin/OpenRune-FileStore,      path: ~/src/OpenRune-FileStore,      base: refs/remotes/origin/main,   upstream: OpenRune/OpenRune-FileStore,      remote: fork}
  harness:   {name: AlexPerrin/osrs-harness,            path: .,                             base: refs/heads/v9,              prefix: harness}
  lab:       {name: AlexPerrin/pr-lab,                 path: ~/src/pr-lab,                  base: refs/remotes/origin/main,   upstream: AlexPerrin/pr-lab,                remote: origin}   # the PR lab: our own repo as its own upstream, the loop's GitHub paths tested against it

bots: []                  # upstream logins whose comments never file a finding, besides those GitHub marks as bots
free: 100                 # GB free on ~/src's volume and /mnt/c below which no build starts and the driver is told compaction is due
builds: 3                 # builds and container steps at once (an N-slot flock semaphore)
agents: 5                 # runs alive at once: the user's word (2026-11-03)
context_limit: 800000     # tokens; past it the hook tells a run to hand off (the user's word: the window is large on their plan)
hold: P2                  # P3 (new quests, stretch goals) held: the user's word (2026-11-01) "Work on P2s. Exclude P3s"
