# The live test server: the game from the deployed image (its game.yml's token-login block holds the sign-in's secret, from
# server/issuer.py key; its embedded Central serves desktops jav_config.ws over http and the sign-in over https with that key's
# certificate, the APK the sign-in over http) and the sidecar that serves the Android app jav_config.ws and slr.ws (http).
# `track.sh deploy` runs it with switch.env, SIDECAR_DATA and ISSUER_DIR (the key's DIR, which also
# holds the APK's jav_config.ws.template: this directory's, params 11, 20, 22 and 28 naming Central's http port 8084); the
# image tag osrs-openrune:241 is moved by deploy, never built here. Every host the sidecar and Central serve is local (javcheck.py checks).
name: osrs-openrune
services:
  openrune:
    image: osrs-openrune:241
    container_name: osrs-openrune
    restart: unless-stopped
    ports: ["${OPENRUNE_GAME_PORT:-40255}:43594", "${OPENRUNE_CENTRAL_HTTP_PORT:-8084}:9090", "${OPENRUNE_CENTRAL_HTTPS_PORT:-8443}:8443"]   # Central's jav_config and sign-in for desktops
    volumes: [openrune-pgdata:/app/.data/postgres]
    environment: {JAVA_OPTS: "-Xmx2g"}
  http:
    image: osrs-rsps-test:241
    container_name: osrs-openrune-http
    restart: unless-stopped
    ports: ["${OPENRUNE_HTTP_PORT:-8081}:8080"]
    volumes: ["${SIDECAR_DATA}:/data:ro", "${ISSUER_DIR}/jav_config.ws.template:/app/protocol/jav_config.ws.template:ro"]
    environment: {WORLD_HOST: "10.0.2.2", HTTP_PUBLIC_PORT: "${OPENRUNE_HTTP_PORT:-8081}", WORLD_ID: "255", SAVE_DIR: /tmp/saves,
                  JAV_CONFIG_TEMPLATE: /app/protocol/jav_config.ws.template, LOCAL_AUTH: "false", PROOF_OF_WORK: "false", VALIDATE_CRCS: "false"}
volumes:
  openrune-pgdata:
