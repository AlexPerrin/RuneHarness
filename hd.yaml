# hd: the facts the harness cannot derive. A repo's path is relative to this file; base is the full ref a candidate
# starts from and (for the tracks without an upstream) the branch a ship fast-forwards; prefix names dev branches. Scripts, rules and skills live in this repo (tracks/<repo>/, .claude/skills/);
# the product repos hold product code only. Per-change clones and build copies are worktrees under <repo>/.worktrees/.
repos:
  client:    {name: AlexPerrin/osrs-plugins-reverse,   path: ~/osrs-plugins-reverse,        base: refs/heads/main,           prefix: client}
  fork:      {name: AlexPerrin/OpenRune-Server,         path: ~/src/OpenRune-Server,         base: refs/remotes/upstream/main, upstream: OpenRune/OpenRune-Server}
  central:   {name: AlexPerrin/OpenRune-Central-Server, path: ~/src/OpenRune-Central-Server, base: refs/remotes/upstream/main, upstream: OpenRune/OpenRune-Central-Server}
  filestore: {name: AlexPerrin/OpenRune-FileStore,      path: ~/src/OpenRune-FileStore,      base: refs/remotes/upstream/main, upstream: OpenRune/OpenRune-FileStore}
  harness:   {name: AlexPerrin/osrs-harness,            path: .,                             base: refs/heads/v9,             prefix: harness}

bots: []                  # upstream logins whose comments never file a finding, besides those GitHub marks as bots
builds: 3                 # builds and container steps at once (an N-slot flock semaphore)
agents: 7                 # runs alive at once (raised from 3, then 6->7 for the P0 qa login fix: the user's word)
context_limit: 800000     # tokens; past it the hook tells a run to hand off (the user's word: the window is large on their plan)
pins:                     # fork branches every integration tree carries besides the changes, in merge order: the user's list
