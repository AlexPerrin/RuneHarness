// A server build with FILESTORE (tracks/fork/build/build.sh): $FDIR is the FileStore head published as a Maven directory
// (tracks/filestore/track.sh publish); every dev.or2 module it holds (the all POM, filestore, definition, tools, …)
// resolves from it alone, never from upstream's hosting, so the pinned or2 version is the head's.
settingsEvaluated { settings ->
    def repo = new File(System.getenv('FDIR'))
    settings.dependencyResolutionManagement.repositories {
        exclusiveContent {
            forRepository { maven { url = repo.toURI() } }
            filter { new File(repo, 'dev/or2').eachDir { includeModule('dev.or2', it.name) } }
        }
    }
}
