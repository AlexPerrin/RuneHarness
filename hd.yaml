# hd: repos, paths, tracks, the agent count, the context limit, the fork's permanent pins.
repos: {client: AlexPerrin/osrs-plugins-reverse, fork: AlexPerrin/OpenRune-Server, upstream: OpenRune/OpenRune-Server, harness: AlexPerrin/osrs-harness}
paths: {work: ~/src/work, cache: ~/src/work/cache}
tracks:                        # clone: the shared read-only clone; head: the dev ref; base: what T merges onto; public: the act that needs the user
  client:  {clone: ~/osrs-plugins-reverse,  remote: origin, head: origin/client/{slug}, base: origin/main, branch: master, public: release}
  server:  {clone: ~/src/OpenRune-Server,   remote: fork,   head: fork/dev/{slug},      base: origin/main, public: upstream}
  harness: {clone: ~/osrs-harness,          remote: origin, head: harness/{slug},       base: main,        branch: main}
agents: 3
context_limit: 150000          # tokens; past it the hook tells the run to hand off
pins:                          # fork branches every integration tree carries; fix/* and fin/* become changes one by one
  - local/android
  - local/local-auth
  - local/op-overrides
  - local/quest-test-fixture
  - local/romeo-juliet
  - local/skip-cs2-packs
  - local/spotless-241
  - local/test-commands
  - local/treasure-trails
  - local/world-settings
  - fin/diaries
  - fin/fairy-rings
  - fin/farming
  - fin/grand-exchange
  - fin/jewellery
  - fin/quest-test-fixture
  - fin/vampyre-slayer
